name: 接口和 Web 自动化测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install pytest requests pytest-html jsonschema fastapi uvicorn

      - name: 运行数据生成脚本（生成测试数据）
        run: |
          python scripts/generate_mock_data.py

      - name: 启动 Mock API 服务
        run: |
          cd api && uvicorn mock_api_server:app --host 0.0.0.0 --port 3001 &
          sleep 3
          # 等待服务就绪
          for i in $(seq 1 10); do
            curl -s http://localhost:3001/health && echo "" && break
            sleep 2
          done

      - name: 运行 pytest 接口测试
        run: |
          cd tests
          python -m pytest api/ -v --html=report.html --self-contained-html

      - name: 上传 API 测试报告 artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: tests/report.html
          retention-days: 30

  # ============================================================
  # 前端 UI 组件测试（Playwright 多浏览器）
  # ============================================================
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: 安装 Playwright 及多浏览器
        run: |
          pip install pytest playwright pytest-html
          python -m playwright install --with-deps chromium firefox webkit

      - name: 运行数据生成脚本
        run: |
          python scripts/generate_mock_data.py

      - name: 启动 Mock API 服务
        run: |
          cd api && uvicorn mock_api_server:app --host 0.0.0.0 --port 3001 &
          sleep 3
          for i in $(seq 1 10); do
            curl -s http://localhost:3001/health && echo "" && break
            sleep 2
          done

      - name: 运行 UI 组件测试（Chromium）
        run: |
          export UI_TEST_BASE_URL=http://localhost:80
          export PYTHONPATH=$GITHUB_WORKSPACE
          mkdir -p $GITHUB_WORKSPACE/results/screenshots

          cd $GITHUB_WORKSPACE
          python -m pytest tests/ui/ \
            -v \
            --headed=false \
            --browser chromium \
            --html=results/ui-report.html \
            --self-contained-html \
            --screenshot \
            -m "chromium" \
            -k "not test_cross_browser" \
            || echo "部分 Chromium 测试未通过（见报告）"

      - name: 运行跨浏览器兼容性测试
        run: |
          export UI_TEST_BASE_URL=http://localhost:80
          export PYTHONPATH=$GITHUB_WORKSPACE

          cd $GITHUB_WORKSPACE

          # Chromium 兼容性
          python -m pytest tests/ui/test_cross_browser.py \
            -v -m chromium \
            --headed=false --browser chromium \
            --html=results/ui-cross-browser-chromium.html --self-contained-html \
            || echo "Chromium 兼容性测试结果见报告"

          # Firefox 兼容性
          python -m pytest tests/ui/test_cross_browser.py tests/ui/pages/ \
            -v -m firefox \
            --headed=false --browser firefox \
            --html=results/ui-cross-browser-firefox.html --self-contained-html \
            || echo "Firefox 兼容性测试结果见报告"

      - name: 上传 UI 测试报告 artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-report
          path: |
            results/ui-report.html
            results/ui-cross-browser-*.html
            tests/ui/screenshots/
          retention-days: 30