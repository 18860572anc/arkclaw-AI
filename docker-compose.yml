version: '3.8'

services:
  # Mock API 服务
  mock-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: beste-mock-api
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - beste-network

  # LanceDB 向量数据库
  lancedb:
    image: lancedb/lancedb:latest
    container_name: beste-lancedb
    volumes:
      - ./data/mock/vector-data:/data
      - ./data/source:/data/source
    ports:
      - "8000:8000"
    networks:
      - beste-network

  # 浏览器自动化环境
  browser:
    image: browserless/chrome:latest
    container_name: beste-browser
    ports:
      - "3000:3000"
    environment:
      - CONNECTION_TIMEOUT=60000
      - MAX_CONCURRENT_SESSIONS=10
      - PREBOOT_CHROME=true
    networks:
      - beste-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: beste-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./web:/usr/share/nginx/html/web
      - ./results:/usr/share/nginx/html/results
    ports:
      - "80:80"
    depends_on:
      - mock-api
    networks:
      - beste-network

  # 测试服务（test profile）
  test-runner:
    profiles:
      - test
    build:
      context: .
      dockerfile: api/Dockerfile.test
    container_name: beste-test-runner
    depends_on:
      mock-api:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - MOCK_API_BASE=http://mock-api:3001
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install -q pytest requests pytest-html jsonschema &&
             python /app/scripts/generate_mock_data.py &&
             cd /app/tests && python -m pytest api/ -v --html=/app/results/report.html --self-contained-html"
    networks:
      - beste-network

  # 前端 UI 组件测试服务（ui-test profile）
  ui-test:
    profiles:
      - ui-test
    build:
      context: .
      dockerfile: Dockerfile.ui-test
    container_name: beste-ui-test
    depends_on:
      mock-api:
        condition: service_healthy
      nginx:
        condition: service_started
    volumes:
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./results:/app/results
    environment:
      - UI_TEST_BASE_URL=http://nginx:80
      - UI_TEST_TIMEOUT=30000
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: >
      sh -c "
        python /app/scripts/generate_mock_data.py &&
        python -m pytest tests/ui/ -v
        --html=/app/results/ui-report.html --self-contained-html
        --browser chromium";
      echo 'UI 测试完成。查看报告: results/ui-report.html'
    networks:
      - beste-network

networks:
  beste-network:
    driver: bridge