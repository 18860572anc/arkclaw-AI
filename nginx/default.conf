server {
    listen 80;
    server_name beste-arkclaw.local;
    root /usr/share/nginx/html;

    # Mock API 路由
    location /api/ {
        proxy_pass http://mock-api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        proxy_pass http://mock-api:3001/health;
        proxy_set_header Host $host;
    }

    # 静态文件服务 - 测试报告
    location /results/ {
        alias /usr/share/nginx/html/results/;
        autoindex on;
    }

    # Web 前端页面
    location /web/ {
        alias /usr/share/nginx/html/web/;
        autoindex on;
        try_files $uri $uri/ /web/index.html;
    }

    # 登录页面
    location = /login {
        return 302 /web/login.html;
    }

    # Dashboard 页面
    location = /dashboard {
        return 302 /web/dashboard.html;
    }

    # AI Agent 页面
    location = /agent {
        return 302 /web/agent.html;
    }

    # 根路径
    location / {
        try_files $uri $uri/ /web/dashboard.html;
    }
}