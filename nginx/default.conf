server {
    listen 80;
    server_name beste-arkclaw.local;

    # Mock API 路由
    location /api/ {
        proxy_pass http://mock-api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        proxy_pass http://mock-api:3001/health;
        proxy_set_header Host $host;
    }

    # 静态文件服务 - 测试报告
    location /results/ {
        alias /opt/beste-arkclaw/results/;
        autoindex on;
    }

    # 根路径重定向到API文档
    location / {
        return 302 /api/status;
    }
}